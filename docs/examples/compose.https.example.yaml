# Run from the repository root with the base file first.
# Requires Docker Compose >= 2.24.4. Replace the domains in gateway.https.conf.
services:
  gateway:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./docker/gateway.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTS_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
