# EXAMPLE ONLY: replace all three domains and the certificate directory.
# The certificate must cover shop.example.com, admin.example.com and media.example.com.
# This gateway terminates TLS itself; do not place it behind another proxy
# without explicitly adapting the trusted-client-IP configuration.
resolver 127.0.0.11 valid=10s ipv6=off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:StoryVerseTLS:10m;
ssl_session_timeout 10m;

map $http_origin $storyverse_media_origin {
    default "";
    "https://shop.example.com" $http_origin;
    "https://admin.example.com" $http_origin;
}

server {
    listen 80;
    server_name shop.example.com admin.example.com media.example.com;
    return 301 https://$host$request_uri;
}

# Keep the existing container health check on an unpublished internal port.
server {
    listen 9000;
    server_name localhost;
    location = /health {
        set $backend medusa-backend:9000;
        proxy_pass http://$backend;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name shop.example.com;
    ssl_certificate /etc/letsencrypt/live/storyverse/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storyverse/privkey.pem;
    client_max_body_size 2m;
    location / {
        set $frontend medusa-storefront:3000;
        proxy_pass http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name admin.example.com;
    ssl_certificate /etc/letsencrypt/live/storyverse/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storyverse/privkey.pem;
    client_max_body_size 33m;
    location / {
        set $backend medusa-backend:9000;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name media.example.com;
    ssl_certificate /etc/letsencrypt/live/storyverse/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storyverse/privkey.pem;
    # Signed query strings are credentials for a short period: omit them from logs.
    access_log off;
    add_header Access-Control-Allow-Origin $storyverse_media_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
    location / {
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET HEAD OPTIONS { deny all; }
        set $storage minio:9000;
        proxy_pass http://$storage;
        proxy_http_version 1.1;
        # Preserve the hostname used to create the S3 signature, and the URI/query.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
