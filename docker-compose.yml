services:
  postgres:
    image: postgres:16-alpine
    container_name: medusa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-medusa_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa_admin} -d ${POSTGRES_DB:-medusa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - medusa_network

  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - medusa_network

  minio:
    # S3-compatible replacement: the former minio/* images cannot be pulled.
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: publishing-storage
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-publishing_minio_admin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "warn"
    ports:
      - "127.0.0.1:9005:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - medusa_network

  minio-init-buckets:
    image: storyverse-backend:local
    container_name: publishing-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["node", "/app/scripts/initialize-storage.cjs"]
    volumes:
      - ./scripts/initialize-storage.cjs:/app/scripts/initialize-storage.cjs:ro
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: publishing-private-media
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-publishing_minio_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    networks:
      - medusa_network

  medusa-backend:
    image: storyverse-backend:local
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runner
    container_name: medusa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init-buckets:
        condition: service_completed_successfully
      database-migrate:
        condition: service_completed_successfully
    expose:
      - "9000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TRUST_GATEWAY_HEADERS=true
      - DATABASE_URL=postgres://${POSTGRES_USER:-medusa_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-medusa_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:9005}
      - S3_BUCKET=publishing-private-media
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-publishing_minio_admin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      - S3_REGION=us-east-1
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_FROM=${SMTP_FROM:-StoryVerse <noreply@storyverse.local>}
      - MAIL_DELIVERY_MODE=${MAIL_DELIVERY_MODE:-local}
    volumes:
      - uploads_data:/app/apps/backend/static
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - medusa_network

  database-migrate:
    image: storyverse-backend:local
    pull_policy: never
    command: ["node", "../../node_modules/@medusajs/cli/cli.js", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-medusa_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
    networks:
      - medusa_network

  mailpit:
    image: axllent/mailpit@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    container_name: publishing-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    networks:
      - medusa_network

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests/Dockerfile
    env_file:
      - .env
    environment:
      TEST_BROWSER_CHANNEL: chromium
      TEST_STOREFRONT_URL: http://medusa-storefront:3000
      TEST_BACKEND_URL: http://medusa-backend:9000
      TEST_MAILPIT_URL: http://mailpit:8025
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-medusa_db}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-publishing_minio_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: publishing-private-media
    volumes:
      - ./scratch/docker-tests:/app/scratch
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./apps:/app/apps:ro
      - ./packages/schemas/src:/app/packages/schemas/src:ro
    shm_size: 1gb
    networks:
      - medusa_network

  medusa-storefront:
    image: storyverse-storefront:local
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_ENABLE_DEMO_MODE: "false"
        NEXT_PUBLIC_MANUAL_PAYMENT_ENABLED: ${NEXT_PUBLIC_MANUAL_PAYMENT_ENABLED:-false}
        NEXT_PUBLIC_MEDIA_ORIGINS: ${NEXT_PUBLIC_MEDIA_ORIGINS:-http://localhost:9005}
    container_name: medusa-storefront
    restart: unless-stopped
    depends_on:
      medusa-backend:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MEDUSA_BACKEND_URL=http://medusa-backend:9000
      - MEDUSA_PUBLISHABLE_KEY=${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_DEFAULT_LOCALE=ar
      - READING_CATALOG_REQUIRED=true
      - TRUST_GATEWAY_HEADERS=true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/ar"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - medusa_network

  gateway:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: publishing-gateway
    restart: unless-stopped
    depends_on:
      medusa-storefront:
        condition: service_healthy
      medusa-backend:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "${PORT:-9000}:9000"
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - medusa_network

networks:
  medusa_network:
    driver: bridge
    name: medusa_network

volumes:
  postgres_data:
    name: medusa_postgres_data
  redis_data:
    name: medusa_redis_data
  storage_data:
    name: publishing_storage_data
  mailpit_data:
    name: publishing_mailpit_data
  uploads_data:
    name: medusa_uploads_data
