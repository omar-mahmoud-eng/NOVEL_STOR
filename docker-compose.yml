services:
  postgres:
    image: postgres:16-alpine
    container_name: medusa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecureDbPassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-medusa_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa_admin} -d ${POSTGRES_DB:-medusa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - medusa_network

  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-SuperSecureRedisPassword2026!} 
      --appendonly yes 
      --maxmemory 512mb 
      --maxmemory-policy volatile-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-SuperSecureRedisPassword2026!} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - medusa_network

  minio:
    image: minio/minio:latest
    container_name: publishing-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-publishing_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SuperSecureMinioPassword2026!}
    ports:
      - "9005:9000"   # S3 Compatible API Endpoint
      - "9001:9001"   # MinIO Management Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - medusa_network

  minio-init-buckets:
    image: minio/mc:latest
    container_name: publishing-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-publishing_minio_admin} ${MINIO_ROOT_PASSWORD:-SuperSecureMinioPassword2026!};
      /usr/bin/mc mb local/publishing-private-media --ignore-existing;
      /usr/bin/mc anonymous set none local/publishing-private-media;
      echo 'Private S3 bucket created and locked against unauthorized access.';
      exit 0;
      "
    networks:
      - medusa_network

  medusa-backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: runner
    container_name: medusa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${PORT:-9000}:9000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-medusa_admin}:${POSTGRES_PASSWORD:-SuperSecureDbPassword2026!}@postgres:5432/${POSTGRES_DB:-medusa_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-SuperSecureRedisPassword2026!}@redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://localhost:9005
      - S3_BUCKET=publishing-private-media
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-publishing_minio_admin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-SuperSecureMinioPassword2026!}
      - S3_REGION=us-east-1
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - medusa_network

  medusa-storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
      target: runner
    container_name: medusa-storefront
    restart: unless-stopped
    depends_on:
      medusa-backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://medusa-backend:9000
      - NEXT_PUBLIC_BASE_URL=http://localhost:3000
      - NEXT_PUBLIC_DEFAULT_LOCALE=ar
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - medusa_network

networks:
  medusa_network:
    driver: bridge
    name: medusa_network

volumes:
  postgres_data:
    name: medusa_postgres_data
  redis_data:
    name: medusa_redis_data
  minio_data:
    name: publishing_minio_data
  uploads_data:
    name: medusa_uploads_data
