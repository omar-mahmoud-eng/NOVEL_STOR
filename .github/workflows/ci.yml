name: Build and runtime verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Generate isolated credentials
        run: |
          node scripts/setup-env.cjs
          mkdir -p scratch/docker-tests
          node - <<'NODE'
          const fs=require('node:fs'),{randomBytes}=require('node:crypto');const credentials='\nADMIN_EMAIL=ci-admin@storyverse.test\nADMIN_PASSWORD=Ci!'+randomBytes(24).toString('hex')+'\n';for(const file of ['.env','apps/backend/.env'])fs.appendFileSync(file,credentials);
          NODE
      - name: Build backend
        run: docker compose build medusa-backend
      - name: Build storefront
        run: docker compose build medusa-storefront
      - name: Build test runner
        run: docker compose --profile test build tests
      - name: Start migrated services
        run: docker compose up -d --wait --wait-timeout 240 postgres redis minio mailpit medusa-backend
      - name: Create isolated administrator
        run: >-
          docker compose exec -T medusa-backend node -e
          'const{spawnSync}=require("node:child_process");const r=spawnSync(process.execPath,["../../node_modules/@medusajs/cli/cli.js","user","--email",process.env.ADMIN_EMAIL,"--password",process.env.ADMIN_PASSWORD],{stdio:"pipe"});if(r.status!==0){console.error("Administrator creation failed");process.exit(1)}'
      - name: Configure empty native store
        run: |
          docker compose --profile test run --rm --user "$(id -u):$(id -g)" -e ALLOW_TEST_BOOTSTRAP=true tests node scripts/bootstrap-test-store.cjs
          node - <<'NODE'
          const fs=require('node:fs');const key=fs.readFileSync('scratch/docker-tests/ci-publishable-key','utf8').trim();if(!key.startsWith('pk_'))throw Error('No publishable key');for(const file of ['.env','apps/backend/.env'])fs.writeFileSync(file,fs.readFileSync(file,'utf8').replace(/^NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=.*$/m,'NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY='+key));
          NODE
          docker compose up -d --wait --wait-timeout 180 medusa-storefront gateway
      - name: Type checks and regressions
        run: |
          docker compose --profile test run --rm tests node node_modules/typescript/bin/tsc --noEmit --incremental false -p apps/backend/tsconfig.json
          docker compose --profile test run --rm tests node node_modules/typescript/bin/tsc --noEmit --incremental false -p apps/storefront/tsconfig.json
          docker compose --profile test run --rm tests node tests/unit-suites.cjs
      - name: Publishing, access, sync, uploads and reports
        run: docker compose --profile test run --rm tests node tests/publishing-upgrades.cjs
      - name: New administration and cross-device browser journeys
        run: docker compose --profile test run --rm tests node tests/publishing-upgrades-ui.cjs
      - name: Existing administration, orders, store and browser regression suites
        run: docker compose --profile test run --rm tests node tests/upgrades-validation.cjs
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p scratch/ci-diagnostics
          docker compose ps > scratch/ci-diagnostics/services.txt
          docker compose logs --no-color --tail=200 > scratch/ci-diagnostics/services.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: verification-results
          path: |
            scratch/docker-tests/**/report.json
            scratch/docker-tests/**/*.png
            scratch/ci-diagnostics/services.txt
          retention-days: 7
